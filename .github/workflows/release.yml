name: Release

on:
  workflow_dispatch:
    inputs:
      rc:
        type: boolean
        default: false
      version:
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: PssbleTrngle/set-package-version@v1
        with:
          version: ${{ github.event.inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - if: ${{ github.event.inputs.rc }}
        run: bun run publish -- -- --provenance --access public --tag rc

      - if: ${{ !github.event.inputs.rc }}
        run: bun run publish -- -- --provenance --access public
